[project]
name = "hegota-compute-repricing"
version = "0.1.0"
description = "Interactive dashboard for repricing EVM compute operations against a configurable throughput anchor"
requires-python = ">=3.11"
dependencies = [
    "benchmarkoor-fetch>=0.2.0",
    "evm-gasfit>=0.0.4",
    "jinja2>=3.1",
    "pandas>=2.0",
    "pyyaml>=6.0",
]

# Only needed to (re)build the committed Xatu opcode-composition artifact via
# `make composition` (queries Xatu's ClickHouse HTTP endpoint). The site build and
# all other targets need none of this.
[project.optional-dependencies]
precompute = [
    "requests>=2.28",
]

[tool.setuptools]
# This project is a pipeline + site builder, not an importable package.
py-modules = []
